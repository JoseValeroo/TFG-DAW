<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Consideraciones Comunes | OTD Comillas</title>
    <style>
        :root {
            --azul-comillas: #003366;
            --azul-claro: #e8f4fc;
            --gris-codigo: #f5f5f5;
            --borde: #ddd;
            --exito: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        header {
            background: var(--azul-comillas);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.3em; font-weight: 500; }
        header small { opacity: 0.8; font-size: 0.85em; }

        .header-buttons { display: flex; gap: 10px; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary { background: var(--exito); color: white; }
        .btn-primary:hover { background: #218838; }
        .btn-secondary { background: white; color: var(--azul-comillas); }
        .btn-secondary:hover { background: var(--azul-claro); }

        .toolbar {
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid var(--borde);
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 8px 12px;
            border: 1px solid var(--borde);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover { background: var(--azul-claro); }
        .toolbar-separator { width: 1px; background: var(--borde); margin: 0 10px; }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 110px);
        }

        .panel { display: flex; flex-direction: column; overflow: hidden; }

        .panel-header {
            background: var(--azul-claro);
            padding: 12px 20px;
            font-weight: 600;
            color: var(--azul-comillas);
            border-bottom: 1px solid var(--borde);
        }

        .panel-editor { border-right: 1px solid var(--borde); }

        #editor {
            flex: 1;
            width: 100%;
            padding: 20px;
            border: none;
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            background: white;
            outline: none;
        }

        #preview {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: white;
            line-height: 1.6;
        }

        #preview h1 { font-size: 1.8em; margin: 0.5em 0; color: var(--azul-comillas); border-bottom: 2px solid var(--azul-comillas); padding-bottom: 10px; }
        #preview h2 { font-size: 1.4em; margin: 0.8em 0; color: var(--azul-comillas); border-bottom: 1px solid var(--borde); padding-bottom: 8px; }
        #preview h3 { font-size: 1.15em; margin: 0.8em 0; color: #444; }
        #preview h4 { font-size: 1em; margin: 0.8em 0; color: #555; }
        #preview p { margin: 0.8em 0; }
        #preview ul, #preview ol { margin: 0.8em 0; padding-left: 25px; }
        #preview li { margin: 0.3em 0; }
        #preview code { background: var(--gris-codigo); padding: 2px 6px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 0.9em; }
        #preview pre { background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 1em 0; }
        #preview pre code { background: none; padding: 0; color: inherit; }
        #preview blockquote { border-left: 4px solid var(--azul-comillas); margin: 1em 0; padding: 10px 20px; background: var(--azul-claro); }
        #preview table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.9em; }
        #preview th, #preview td { border: 1px solid var(--borde); padding: 8px 10px; text-align: left; }
        #preview th { background: var(--azul-comillas); color: white; }
        #preview tr:nth-child(even) { background: var(--gris-codigo); }
        #preview hr { border: none; border-top: 2px solid var(--borde); margin: 1.5em 0; }

        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--exito);
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status.show { opacity: 1; }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            .panel-editor { border-right: none; border-bottom: 1px solid var(--borde); }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Consideraciones Comunes</h1>
            <small>Archivo: CONSIDERACIONES.md</small>
        </div>
        <div class="header-buttons">
            <a href="../GUIA_MARKDOWN.html" target="_blank" class="btn btn-secondary">Ver guía MD</a>
            <button class="btn btn-primary" onclick="guardarArchivo()">Guardar .md</button>
        </div>
    </header>

    <div class="toolbar">
        <button onclick="insertarTexto('# ', '')">H1</button>
        <button onclick="insertarTexto('## ', '')">H2</button>
        <button onclick="insertarTexto('### ', '')">H3</button>
        <div class="toolbar-separator"></div>
        <button onclick="insertarTexto('**', '**')"><b>B</b></button>
        <button onclick="insertarTexto('*', '*')"><i>I</i></button>
        <div class="toolbar-separator"></div>
        <button onclick="insertarTexto('- ', '')">Lista</button>
        <button onclick="insertarTexto('- [ ] ', '')">Check</button>
        <button onclick="insertarTexto('`', '`')">Código</button>
        <button onclick="insertarTabla()">Tabla</button>
        <div class="toolbar-separator"></div>
        <button onclick="insertarTexto('> ', '')">Cita</button>
        <button onclick="insertarTexto('\n---\n', '')">Línea</button>
        <button onclick="insertarContacto()">Contacto</button>
    </div>

    <div class="main-container">
        <div class="panel panel-editor">
            <div class="panel-header">Editor Markdown</div>
            <textarea id="editor"></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">Vista Previa</div>
            <div id="preview"></div>
        </div>
    </div>

    <div class="status" id="status">Archivo guardado</div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        const contenidoInicial = `# Consideraciones Comunes

Normativas, requisitos legales y advertencias transversales para proyectos de la OTD - Universidad Pontificia Comillas.

---

## 1. Protección de Datos (RGPD/LOPDGDD)

### 1.1 Marco Legal

| Normativa | Ámbito | Obligatoriedad |
|-----------|--------|----------------|
| **RGPD** (Reglamento UE 2016/679) | Datos personales ciudadanos UE | Obligatorio |
| **LOPDGDD** (LO 3/2018) | Adaptación española | Obligatorio |
| **Política Comillas** | Normativa interna | Obligatorio |

### 1.2 Checklist de Cumplimiento

#### Antes de Empezar el Proyecto

- [ ] Identificar qué datos personales se tratarán
- [ ] Determinar la base legal del tratamiento
- [ ] Verificar si se necesita Evaluación de Impacto (EIPD)
- [ ] Consultar con el DPO de Comillas si hay dudas

#### Durante el Desarrollo

- [ ] Implementar consentimiento explícito donde sea necesario
- [ ] Diseñar formularios con casillas de aceptación (no premarcadas)
- [ ] Incluir enlaces a política de privacidad
- [ ] Implementar derecho de acceso, rectificación y supresión
- [ ] Cifrar datos sensibles en base de datos
- [ ] Logs de acceso a datos personales

### 1.3 Retención de Datos

| Tipo de dato | Periodo máximo | Acción al vencer |
|--------------|----------------|------------------|
| Datos de sesión | Duración sesión | Eliminar automáticamente |
| Logs de acceso | 2 años | Anonimizar o eliminar |
| Datos académicos | Según normativa | Archivar o eliminar |
| Datos de contacto | Mientras dure relación | Solicitar renovación o eliminar |

---

## 2. Accesibilidad (WCAG 2.1)

### 2.1 Obligatoriedad

| Tipo de proyecto | Nivel requerido | Normativa |
|------------------|-----------------|-----------|
| Webs públicas de Comillas | AA | RD 1112/2018 |
| Aplicaciones internas | AA (recomendado) | Buenas prácticas |
| Apps móviles | AA | Directiva UE 2016/2102 |

### 2.2 Checklist por Principio WCAG

#### Perceptible
- [ ] Textos alternativos en imágenes (\`alt\`)
- [ ] Subtítulos en vídeos
- [ ] Contraste mínimo 4.5:1 (texto normal)
- [ ] No depender solo del color para transmitir información

#### Operable
- [ ] Navegación completa por teclado
- [ ] Tiempo suficiente para leer/interactuar
- [ ] Focus visible en elementos interactivos

#### Comprensible
- [ ] Idioma de la página declarado (\`lang="es"\`)
- [ ] Navegación consistente
- [ ] Etiquetas en formularios
- [ ] Mensajes de error claros

#### Robusto
- [ ] HTML válido y semántico
- [ ] ARIA usado correctamente
- [ ] Compatible con tecnologías asistivas

### 2.3 Herramientas de Validación

| Herramienta | Uso | URL |
|-------------|-----|-----|
| WAVE | Análisis automático | webaim.org/wave |
| axe DevTools | Extensión navegador | deque.com/axe |
| Lighthouse | Auditoría Chrome | Integrado en DevTools |

---

## 3. Normativa Interna de Comillas

### 3.1 Identidad Corporativa

- [ ] Usar logos oficiales (solicitar a Comunicación)
- [ ] Respetar paleta de colores corporativa
- [ ] Tipografías autorizadas
- [ ] Footer con información legal requerida

### 3.2 Dominios y URLs

| Tipo | Formato | Ejemplo |
|------|---------|---------|
| Producción | *.comillas.edu | app.comillas.edu |
| Desarrollo | *.dev.comillas.edu | app.dev.comillas.edu |
| APIs | api.*.comillas.edu | api.app.comillas.edu |

### 3.3 Autenticación Corporativa

**Método obligatorio:** Azure AD de Comillas

**Configuración requerida:**
- TenantId de Comillas
- ClientId de la aplicación (solicitar a IT)
- Redirect URIs aprobadas

---

## 4. Integraciones con Sistemas Existentes

### 4.1 Sistemas Core de Comillas

| Sistema | Tipo | Contacto |
|---------|------|----------|
| **Oracle/PeopleSoft** | ERP académico | IT - Sistemas |
| **Moodle** | LMS | IT - Educación |
| **SharePoint** | Documentos | IT - Colaboración |
| **Power BI** | Reporting | IT - BI |

### 4.2 Datos Maestros

**Fuente de verdad para:**

| Dato | Sistema origen | Cómo obtener |
|------|----------------|--------------|
| Usuarios/empleados | Azure AD | Microsoft Graph API |
| Estudiantes | Oracle/PeopleSoft | API específica |
| Asignaturas | Oracle/PeopleSoft | API específica |
| Estructura organizativa | RRHH | Consultar con RRHH |

**Regla:** No duplicar datos maestros. Siempre consumir del sistema origen.

---

## 5. Auditoría y Trazabilidad

### 5.1 Requisitos de Logging

#### Obligatorio Registrar

| Evento | Datos a guardar | Retención |
|--------|-----------------|-----------|
| Login/Logout | Usuario, IP, timestamp, resultado | 2 años |
| Acceso a datos sensibles | Usuario, dato accedido, timestamp | 2 años |
| Modificaciones | Usuario, antes/después, timestamp | 2 años |
| Eliminaciones | Usuario, dato eliminado, timestamp | 5 años |

#### Prohibido Registrar

- Contraseñas (ni cifradas)
- Tokens de sesión completos
- Datos de tarjetas de crédito
- Datos médicos en texto claro

---

## 6. Entornos y Despliegues

### 6.1 Entornos Obligatorios

| Entorno | Propósito | Datos |
|---------|-----------|-------|
| **Desarrollo** | Desarrollo activo | Datos ficticios |
| **Staging/Pre** | Pruebas de aceptación | Datos anonimizados |
| **Producción** | Usuarios reales | Datos reales |

### 6.2 Ventanas de Despliegue

| Tipo | Horario permitido | Aprobación |
|------|-------------------|------------|
| Menor (bugfix) | Horario laboral | Líder técnico |
| Mayor (features) | Viernes tarde o finde | JP |
| Crítico (seguridad) | Inmediato | JP + IT |

---

## 7. Checklist Final de Proyecto

### 7.1 Antes de Ir a Producción

#### Legal y Compliance
- [ ] RGPD: Consentimientos implementados
- [ ] RGPD: Política de privacidad publicada
- [ ] Accesibilidad: Nivel AA verificado
- [ ] Identidad corporativa: Logos y colores correctos

#### Técnico
- [ ] Azure Key Vault configurado
- [ ] Blob Storage para archivos
- [ ] Redis para caché
- [ ] Application Insights activo
- [ ] Logs de auditoría funcionando
- [ ] HTTPS con certificado válido

#### Integraciones
- [ ] Azure AD corporativo funcionando
- [ ] APIs de sistemas conectadas
- [ ] Pruebas de integración pasadas

#### Operaciones
- [ ] Backups configurados
- [ ] Monitorización activa
- [ ] Runbook documentado
- [ ] Equipo de soporte informado

---

## 8. Contactos de Referencia

### 8.1 Internos Comillas

| Área | Contacto | Para qué |
|------|----------|----------|
| **IT - Sistemas** | [email] | Infraestructura, servidores |
| **IT - Desarrollo** | [email] | APIs, integraciones |
| **DPO** | [email] | Protección de datos |
| **Comunicación** | [email] | Identidad corporativa |
| **Secretaría General** | [email] | Normativa, legal |

---

**Versión:** 1.0
**Fecha:** Diciembre 2025
**Responsable:** Comité Técnico OTD`;

        editor.value = contenidoInicial;
        actualizarPreview();

        editor.addEventListener('input', actualizarPreview);

        function actualizarPreview() {
            let md = editor.value;
            let html = convertirMarkdown(md);
            preview.innerHTML = html;
        }

        function convertirMarkdown(md) {
            md = md.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => '<pre><code>' + code.trim() + '</code></pre>');
            md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
            md = md.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
            md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            md = md.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            md = md.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            md = md.replace(/^---$/gm, '<hr>');
            md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            md = md.replace(/\*(.+?)\*/g, '<em>$1</em>');
            md = md.replace(/^- \[x\] (.+)$/gm, '<p>☑ $1</p>');
            md = md.replace(/^- \[ \] (.+)$/gm, '<p>☐ $1</p>');
            md = md.replace(/^- (.+)$/gm, '<li>$1</li>');
            md = md.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
            md = md.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
            md = md.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
            md = md.replace(/^\|(.+)\|$/gm, function(match, content) {
                if (content.match(/^[\s\-:|]+$/)) return '<!--sep-->';
                let cells = content.split('|').map(c => c.trim());
                return '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
            });
            md = md.replace(/(<tr>.*<\/tr>\n?)+/g, function(match) {
                let rows = match.replace(/<!--sep-->\n?/g, '');
                rows = rows.replace(/<tr>(.*?)<\/tr>/, (m, c) => '<tr>' + c.replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>') + '</tr>');
                return '<table>' + rows + '</table>';
            });
            md = md.replace(/<!--sep-->/g, '');
            md = md.replace(/^(?!<[hupbolt]|<\/|<li|<hr|<pre|<table|<tr|☐|☑)(.+)$/gm, '<p>$1</p>');
            return md;
        }

        function insertarTexto(antes, despues) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const texto = editor.value;
            const sel = texto.substring(start, end) || 'texto';
            editor.value = texto.substring(0, start) + antes + sel + despues + texto.substring(end);
            editor.setSelectionRange(start + antes.length, start + antes.length + sel.length);
            editor.focus();
            actualizarPreview();
        }

        function insertarTabla() {
            const start = editor.selectionStart;
            const texto = editor.value;
            const tabla = '\n| Columna 1 | Columna 2 |\n|-----------|----------|\n| Dato 1    | Dato 2   |\n';
            editor.value = texto.substring(0, start) + tabla + texto.substring(start);
            editor.focus();
            actualizarPreview();
        }

        function insertarContacto() {
            const start = editor.selectionStart;
            const texto = editor.value;
            const contacto = '| **Área** | [email] | Descripción |';
            editor.value = texto.substring(0, start) + contacto + texto.substring(start);
            editor.focus();
            actualizarPreview();
        }

        function guardarArchivo() {
            const blob = new Blob([editor.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'CONSIDERACIONES.md';
            a.click();
            URL.revokeObjectURL(url);
            mostrarStatus();
        }

        function mostrarStatus() {
            const status = document.getElementById('status');
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 2000);
        }

        editor.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                guardarArchivo();
            }
        });
    </script>
</body>
</html>
